{% extends "layout.html" %}
{% block title %}
    <title> Blog </title>
    <link rel="stylesheet" href="{{ url_for('static', filename='blog.css') }}">
    {% endblock %}

{% block main %}
    <h1>Blog</h1>
    {% for blog in blogs %}
        <a href="{{ url_for('blog_detail', blog_id=blog['id']) }}" class="blog-link">
            <section class="blog-summary">
                <h3>{{ blog.title }}</h3>
                <p><strong>Tags:</strong> {{ blog.tags }}</p>
                <p><strong>Author:</strong> {{ blog.author }}</p>
                <p><strong>Date:</strong> {{ blog.date }}</p>
                <p>{{ blog['content'][:150] }}...</p>
            </section>
        </a>
    {% endfor %}
{% endblock %}
